name: Publicar

# A cada push na main, gera o TI-GA.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.12), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/TI-GA.exe, dist/LEIA-ME.txt -DestinationPath TI-GA.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes; $global:LASTEXITCODE = 0
          gh release create latest TI-GA.zip dist/TI-GA.exe --target $env:GITHUB_SHA --latest --title "T.I - G.A (versão mais recente)" --notes-file NOVIDADES.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME TI-GA.zip dist/TI-GA.exe --title "T.I - G.A $env:GITHUB_REF_NAME" --generate-notes --latest=false
